name: Test quarto failure propagates
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install failing fake quarto
        run: |
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/quarto <<'EOF'
          #!/bin/sh
          echo "$*" > /tmp/quarto-args.log
          echo "ERROR: simulated publish failure" >&2
          exit 3
          EOF
          chmod +x /tmp/fakebin/quarto
          rm -f /tmp/quarto-args.log
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          to: netlify
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/quarto-args.log || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"
            exit 1
          fi
          if [ ! -f /tmp/quarto-args.log ]; then
            echo "FAIL: quarto was never invoked"
            exit 1
          fi
          echo "PASS"
