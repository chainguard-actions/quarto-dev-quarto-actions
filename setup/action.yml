name: 'Setup Quarto'
author: 'Christophe Dervieux'
description: 'This action will setup Quarto from the git repository https://github.com/quarto-dev/quarto-cli/'
inputs:
  version:
    description: 'The version of Quarto to use. Either a release tag without "v" prefix (e.g., "0.9.486"), "pre-release" for latest built dev version, or "release", for the latest stable version.'
    required: false
    default: 'release'
  tinytex:
    description: 'If true, install TinyTex, required for PDF rendering'
    required: false
    default: 'false'
outputs:
  version:
    description: 'The installed version of quarto.'
runs:
  using: 'composite'
  steps: 
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: 'Choose which binary to use'
      run: |
        # Select correct bundle for OS type
        case "$RUNNER_OS" in 
          "Linux")
              case "$RUNNER_ARCH" in
                ARM64|ARM)
                  echo "BUNDLE_EXT=linux-arm64.deb" >> "$GITHUB_ENV"
                  ;;
                *)
                  echo "BUNDLE_EXT=linux-amd64.deb" >> "$GITHUB_ENV"
                  ;;
              esac
              ;;
           "macOS")
              echo "BUNDLE_EXT=macos.pkg" >> "$GITHUB_ENV"
              ;;
           "Windows")
              echo "BUNDLE_EXT=win.msi" >> "$GITHUB_ENV"
              ;;
            *)
              echo "$RUNNER_OS not supported"
              exit 1
              ;;
        esac
      shell: bash
      working-directory: ${{ runner.temp }}
    - name: 'Download Quarto'
      id: download-quarto 
      env: 
        GITHUB_TOKEN: ${{ github.token }}
        RUNNER_OS_NAME: ${{ runner.os }}
        INPUT_VERSION: ${{ inputs.version }}
        QUARTO_BUNDLE_EXT: ${{ env.BUNDLE_EXT }}
      run: |
        if [ "$RUNNER_OS_NAME" != "Windows" ]; then
          # On Windows scoop will be used so no need to download the release
          if [ "$INPUT_VERSION" == "release" ]; then
            # download the latest stable release
            version=$(curl https://quarto.org/docs/download/_download.json | jq -r '.version')
            wget "https://github.com/quarto-dev/quarto-cli/releases/download/v${version}/quarto-${version}-${QUARTO_BUNDLE_EXT}"
            safe_version=$(printf '%s' "$version" | tr -d '\n\r')
            echo "version=${safe_version}" >> "$GITHUB_OUTPUT"
          elif [ "$INPUT_VERSION" == "LATEST" -o "$INPUT_VERSION" == "pre-release" ]; then
            # get latest pre release version 
            version=$(curl https://quarto.org/docs/download/_prerelease.json | jq -r '.version')
            wget "https://github.com/quarto-dev/quarto-cli/releases/download/v${version}/quarto-${version}-${QUARTO_BUNDLE_EXT}"
            safe_version=$(printf '%s' "$version" | tr -d '\n\r')
            echo "version=${safe_version}" >> "$GITHUB_OUTPUT"
          else
            # download a specific release
            wget "https://github.com/quarto-dev/quarto-cli/releases/download/v${INPUT_VERSION}/quarto-${INPUT_VERSION}-${QUARTO_BUNDLE_EXT}"
            safe_version=$(printf '%s' "$INPUT_VERSION" | tr -d '\n\r')
            echo "version=${safe_version}" >> "$GITHUB_OUTPUT"
          fi
          raw_installer="$(ls quarto*"${QUARTO_BUNDLE_EXT}")" || true
          safe_installer=$(printf '%s' "$raw_installer" | tr -d '\n\r')
          echo "installer=${safe_installer}" >> "$GITHUB_OUTPUT"
        else
          : # do nothing for now (https://github.com/quarto-dev/quarto-actions/issues/59 :facepalm:)
          # FIXME: how to get version information from scoop in windows runners?
          # send the cderv bat-signal!
        fi
      shell: bash
      working-directory: ${{ runner.temp }}
    - name: 'Install Quarto'
      env:
        RUNNER_OS_NAME: ${{ runner.os }}
        INPUT_VERSION: ${{ inputs.version }}
        QUARTO_INSTALLER: ${{ steps.download-quarto.outputs.installer }}
      run: |
        # Install quarto
        [ "$RUNNER_OS_NAME" != "Windows" ] && installer="$QUARTO_INSTALLER"
        case "$RUNNER_OS" in 
          "Linux")
              sudo apt -y install "./$installer"
              ;;
           "macOS")
              sudo installer -pkg "./$installer" -target '/'
              ;;
           "Windows")
              # can't install msi for now so use scoop
              if [ "$INPUT_VERSION" == "release" ]
              then
                powershell -File "$GITHUB_ACTION_PATH/install-quarto-windows.ps1"
              else
                powershell -File "$GITHUB_ACTION_PATH/install-quarto-windows.ps1" "$INPUT_VERSION"
              fi
              ;;
            *)
              echo "$RUNNER_OS not supported"
              exit 1
              ;;
        esac
        [ "$RUNNER_OS_NAME" != "Windows" ] && rm "$installer"
        echo "Quarto Installed !"
      shell: bash
      working-directory: ${{ runner.temp }}
    - name: 'Install TinyTeX'
      env:
        QUARTO_PRINT_STACK: true
      if: ${{ inputs.tinytex == 'true'}}
      run: |
        quarto install tool tinytex --no-prompt --log-level warning
        case "$RUNNER_OS" in 
          "Linux")
              tt_path="$HOME/bin"
              ;;
           "macOS")
              tlmgr_file="$(find ~/Library/TinyTeX -name tlmgr)" || true
              tt_path="$(dirname "$tlmgr_file")" || true
              ;;
           "Windows")
              tlmgr_file="$(find "$APPDATA/TinyTeX" -name tlmgr.bat)" || true
              tt_path="$(dirname "$tlmgr_file")" || true
              ;;
            *)
              echo "$RUNNER_OS not supported"
              exit 1
              ;;
        esac
        safe_path=$(printf '%s' "$tt_path" | tr -d '\n\r')
        echo "$safe_path" >> "$GITHUB_PATH"
        echo "TinyTeX installed !"
      shell: bash
      working-directory: ${{ runner.temp }}
